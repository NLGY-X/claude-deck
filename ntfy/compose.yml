# The deck's push server: one ntfy container on a box you control.
# ntfy/install.sh copies this folder to ~/ntfy there and Caddy proxies your
# NTFY_HOST to it; nothing outside the box reaches the port. The bridge on the
# PC posts to one topic whose name is the secret; the phone's ntfy app
# subscribes to the same topic.
services:
  ntfy:
    image: binwiederhier/ntfy:v2
    container_name: deck-ntfy
    command: serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:2586:80"
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ./cache:/var/cache/ntfy
      - ./auth:/var/lib/ntfy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 5s
      start_period: 15s
